# Managed by hestia-de-noise
# WordPress web bans in the existing Fail2ban service, on ports 80/443 only.
[INCLUDES]
before = hestia.conf
[Definition]
actionstart = <wp_start>
actionstop = <wp_stop>
actioncheck = <wp_check>
actionban = <wp_ban>
actionunban = <wp_unban>
actionflush = <wp_flush>
[Init]
name = WORDPRESS
port = 80,443
protocol = tcp
blocktype = DROP
wp_start = /usr/bin/flock -w 30 /run/hestia-firewall.lock /usr/local/hestia/bin/v-add-firewall-chain <name> 80,443 TCP
wp_stop = /usr/bin/flock -w 30 /run/hestia-firewall.lock /usr/local/hestia/bin/v-delete-firewall-chain <name>
wp_check = /usr/sbin/iptables -C INPUT -p tcp -m multiport --dports 80,443 -j fail2ban-<name>
wp_ban = /usr/bin/flock -w 30 /run/hestia-firewall.lock /usr/local/hestia/bin/v-add-firewall-ban <ip> <name>
wp_unban = /usr/bin/flock -w 30 /run/hestia-firewall.lock /usr/bin/env HESTIA_F2B_CALLER=1 /usr/local/hestia/bin/v-delete-firewall-ban <ip> <name>
wp_flush =
[Init?family=inet6]
wp_start = { /usr/sbin/ip6tables -w -C fail2ban-<name> -j RETURN >/dev/null 2>&1; } || { /usr/sbin/ip6tables -w -N fail2ban-<name>; /usr/sbin/ip6tables -w -A fail2ban-<name> -j RETURN; }
              { /usr/sbin/ip6tables -w -C INPUT -p tcp -m multiport --dports 80,443 -j fail2ban-<name> >/dev/null 2>&1; } || /usr/sbin/ip6tables -w -I INPUT -p tcp -m multiport --dports 80,443 -j fail2ban-<name>
wp_stop = /usr/sbin/ip6tables -w -D INPUT -p tcp -m multiport --dports 80,443 -j fail2ban-<name>
             /usr/sbin/ip6tables -w -F fail2ban-<name>
             /usr/sbin/ip6tables -w -X fail2ban-<name>
wp_check = /usr/sbin/ip6tables -w -C INPUT -p tcp -m multiport --dports 80,443 -j fail2ban-<name>
wp_ban = /usr/sbin/ip6tables -w -I fail2ban-<name> 1 -s <ip> -j DROP
wp_unban = /usr/sbin/ip6tables -w -D fail2ban-<name> -s <ip> -j DROP
wp_flush = /usr/sbin/ip6tables -w -F fail2ban-<name>
